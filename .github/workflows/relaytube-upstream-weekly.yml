name: Sync SmartTube updates weekly

on:
  # GitHub Actions schedules use UTC. Run at both candidate hours and allow exactly 9 AM Eastern.
  schedule:
    - cron: "0 13,14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relaytube-smarttube-weekly-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      beta_changed: ${{ steps.sync.outputs.beta_changed || 'false' }}
      stable_changed: ${{ steps.sync.outputs.stable_changed || 'false' }}
      beta_version_name: ${{ steps.sync.outputs.beta_version_name }}
      beta_version_code: ${{ steps.sync.outputs.beta_version_code }}
      beta_release_notes: ${{ steps.sync.outputs.beta_release_notes }}
      beta_source_ref: ${{ steps.sync.outputs.beta_source_ref }}
      stable_version_name: ${{ steps.sync.outputs.stable_version_name }}
      stable_version_code: ${{ steps.sync.outputs.stable_version_code }}
      stable_release_notes: ${{ steps.sync.outputs.stable_release_notes }}
      stable_source_ref: ${{ steps.sync.outputs.stable_source_ref }}
    steps:
      - name: Keep only the 9 AM Eastern schedule
        id: schedule
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" && "$(TZ=America/New_York date +%H)" != "09" ]]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out RelayTube
        if: steps.schedule.outputs.proceed == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Copy sync script outside the branch worktree
        if: steps.schedule.outputs.proceed == 'true'
        run: cp scripts/sync_smarttube_updates.py "$RUNNER_TEMP/sync_smarttube_updates.py"

      - name: Merge upstream changes and prepare release versions
        id: sync
        if: steps.schedule.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: python3 "$RUNNER_TEMP/sync_smarttube_updates.py"

  publish-stable:
    needs: sync
    if: needs.sync.outputs.stable_changed == 'true'
    uses: ./.github/workflows/relaytube-release.yml
    with:
      channel: stable
      version_name: ${{ needs.sync.outputs.stable_version_name }}
      version_code: ${{ needs.sync.outputs.stable_version_code }}
      release_notes: ${{ needs.sync.outputs.stable_release_notes }}
      source_ref: ${{ needs.sync.outputs.stable_source_ref }}
    secrets: inherit

  publish-beta:
    needs: sync
    if: needs.sync.outputs.beta_changed == 'true'
    uses: ./.github/workflows/relaytube-release.yml
    with:
      channel: beta
      version_name: ${{ needs.sync.outputs.beta_version_name }}
      version_code: ${{ needs.sync.outputs.beta_version_code }}
      release_notes: ${{ needs.sync.outputs.beta_release_notes }}
      source_ref: ${{ needs.sync.outputs.beta_source_ref }}
    secrets: inherit
