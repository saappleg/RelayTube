name: Publish RelayTube update

# RelayTube-only release automation. Each channel has a rolling GitHub release
# so the Android updater can use stable URLs while versioned releases remain
# available for history and rollback.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel
        required: true
        type: choice
        options:
          - alpha
          - beta
          - stable
      version_name:
        description: Version name (for example 0.1.0-beta.1)
        required: true
        type: string
      version_code:
        description: Monotonically increasing Android version code
        required: true
        type: string
      release_notes:
        description: Short release notes
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out RelayTube
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Validate release inputs
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          test "$VERSION_CODE" -gt 2429
          case "$VERSION_NAME" in
            *[!0-9A-Za-z._-]*) exit 1 ;;
          esac

      - name: Configure RelayTube signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_KEY"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$GITHUB_WORKSPACE/relaytube-release.p12"
          {
            echo "storeFile=$GITHUB_WORKSPACE/relaytube-release.p12"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Select build flavor
        run: |
          case "${{ inputs.channel }}" in
            alpha) echo "FLAVOR=stalpha" >> "$GITHUB_ENV"; echo "UPDATE_CHANNEL=alpha" >> "$GITHUB_ENV" ;;
            beta) echo "FLAVOR=stbeta" >> "$GITHUB_ENV"; echo "UPDATE_CHANNEL=beta" >> "$GITHUB_ENV" ;;
            stable) echo "FLAVOR=ststable" >> "$GITHUB_ENV"; echo "UPDATE_CHANNEL=stable" >> "$GITHUB_ENV" ;;
            *) exit 1 ;;
          esac

      - name: Build signed RelayTube APKs
        env:
          RELAYTUBE_VERSION_CODE: ${{ inputs.version_code }}
          RELAYTUBE_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          chmod +x gradlew
          ./gradlew ":smarttubetv:lint${FLAVOR^}Release" ":smarttubetv:assemble${FLAVOR^}Release" \
            -PrelayTubeUpdateChannel="$UPDATE_CHANNEL"

      - name: Prepare release assets and update manifest
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          TAG_NAME="relaytube-$CHANNEL"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          mkdir -p release-assets

          cp "smarttubetv/build/outputs/apk/$FLAVOR/release/"*_armeabi-v7a.apk "release-assets/relaytube-$CHANNEL-armeabi-v7a.apk"
          cp "smarttubetv/build/outputs/apk/$FLAVOR/release/"*_arm64-v8a.apk "release-assets/relaytube-$CHANNEL-arm64-v8a.apk"
          cp "smarttubetv/build/outputs/apk/$FLAVOR/release/"*_x86.apk "release-assets/relaytube-$CHANNEL-x86.apk"
          cp "smarttubetv/build/outputs/apk/$FLAVOR/release/"*_universal.apk "release-assets/relaytube-$CHANNEL-universal.apk"

          export DOWNLOAD_ROOT="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}"
          jq -n \
            --arg channel "$CHANNEL" \
            --arg name "$VERSION_NAME" \
            --argjson code "$VERSION_CODE" \
            --arg notes "$RELEASE_NOTES" \
            --arg root "$DOWNLOAD_ROOT" \
            '{
              package: {
                channel: $channel,
                downloadUrl: ($root + "/relaytube-" + $channel + "-universal.apk"),
                downloadUrlList: [($root + "/relaytube-" + $channel + "-universal.apk")],
                "downloadUrlList_armeabi-v7a": [($root + "/relaytube-" + $channel + "-armeabi-v7a.apk"), ($root + "/relaytube-" + $channel + "-universal.apk")],
                "downloadUrlList_arm64-v8a": [($root + "/relaytube-" + $channel + "-arm64-v8a.apk"), ($root + "/relaytube-" + $channel + "-universal.apk")],
                "downloadUrlList_x86": [($root + "/relaytube-" + $channel + "-x86.apk"), ($root + "/relaytube-" + $channel + "-universal.apk")],
                "downloadUrlList_x86_64": [($root + "/relaytube-" + $channel + "-universal.apk")]
              },
              ($name): {
                versionCode: $code,
                changelog: [$notes]
              }
            }' > release-assets/relaytube-update.json

      - name: Validate updater manifest
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          jq -e '.package.downloadUrl | strings' release-assets/relaytube-update.json >/dev/null
          jq -e '.package.downloadUrlList | arrays | length > 0' release-assets/relaytube-update.json >/dev/null
          jq -e --arg version "$VERSION_NAME" --argjson code "$VERSION_CODE" \
            '.[ $version ].versionCode == $code and (.[ $version ].changelog | type == "array")' \
            release-assets/relaytube-update.json >/dev/null
          jq empty release-assets/relaytube-update.json

      - name: Publish rolling channel release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          VERSION_NAME: ${{ inputs.version_name }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/* --clobber
            if [ "$CHANNEL" = "stable" ]; then
              gh release edit "$TAG_NAME" --target "$GITHUB_SHA" --title "RelayTube $VERSION_NAME" --notes "$RELEASE_NOTES" --latest
            else
              gh release edit "$TAG_NAME" --target "$GITHUB_SHA" --title "RelayTube $VERSION_NAME" --notes "$RELEASE_NOTES" --prerelease --latest=false
            fi
          elif [ "$CHANNEL" = "stable" ]; then
            gh release create "$TAG_NAME" release-assets/* --target "$GITHUB_SHA" --title "RelayTube $VERSION_NAME" --notes "$RELEASE_NOTES" --latest
          else
            gh release create "$TAG_NAME" release-assets/* --target "$GITHUB_SHA" --title "RelayTube $VERSION_NAME" --notes "$RELEASE_NOTES" --prerelease --latest=false
          fi
