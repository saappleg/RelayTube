name: Publish RelayTube update

# RelayTube-only release automation. Do not include this workflow in SmartTube upstream changes.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel
        required: true
        type: choice
        options:
          - beta
          - stable
      version_name:
        description: Version name (for example 0.2.0-beta.1)
        required: true
        type: string
      version_code:
        description: Monotonically increasing Android version code
        required: true
        type: string
      release_notes:
        description: Short release notes
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out RelayTube
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Validate release inputs
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          test "$VERSION_CODE" -gt 2434
          case "$VERSION_NAME" in
            *[!0-9A-Za-z._-]*) exit 1 ;;
          esac

      - name: Configure RelayTube signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_KEY"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$GITHUB_WORKSPACE/relaytube-release.p12"
          {
            echo "storeFile=$GITHUB_WORKSPACE/relaytube-release.p12"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed RelayTube APKs
        env:
          RELAYTUBE_VERSION_CODE: ${{ inputs.version_code }}
          RELAYTUBE_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          chmod +x gradlew
          ./gradlew :smarttubetv:lintStstableRelease :smarttubetv:assembleStstableRelease

      - name: Prepare release assets and update manifest
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          if [ "$CHANNEL" = "beta" ]; then
            TAG_NAME="relaytube-beta"
          else
            TAG_NAME="v${VERSION_NAME}"
          fi
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

          mkdir -p release-assets
          cp smarttubetv/build/outputs/apk/ststable/release/*_armeabi-v7a.apk release-assets/relaytube-armeabi-v7a.apk
          cp smarttubetv/build/outputs/apk/ststable/release/*_arm64-v8a.apk release-assets/relaytube-arm64-v8a.apk
          cp smarttubetv/build/outputs/apk/ststable/release/*_x86.apk release-assets/relaytube-x86.apk
          cp smarttubetv/build/outputs/apk/ststable/release/*_universal.apk release-assets/relaytube-universal.apk

          export DOWNLOAD_ROOT="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}"
          jq -n \
            --arg name "$VERSION_NAME" \
            --argjson code "$VERSION_CODE" \
            --arg notes "$RELEASE_NOTES" \
            --arg root "$DOWNLOAD_ROOT" \
            '{
              package: {
                downloadUrl: ($root + "/relaytube-universal.apk"),
                downloadUrlList: [($root + "/relaytube-universal.apk")],
                "downloadUrlList_armeabi-v7a": [($root + "/relaytube-armeabi-v7a.apk"), ($root + "/relaytube-universal.apk")],
                "downloadUrlList_arm64-v8a": [($root + "/relaytube-arm64-v8a.apk"), ($root + "/relaytube-universal.apk")],
                "downloadUrlList_x86": [($root + "/relaytube-x86.apk"), ($root + "/relaytube-universal.apk")],
                "downloadUrlList_x86_64": [($root + "/relaytube-universal.apk")]
              },
              ($name): {
                versionCode: $code,
                changelog: [$notes]
              }
            }' > release-assets/relaytube-update.json

      - name: Validate updater manifest
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          jq -e \
            --arg version "$VERSION_NAME" \
            --argjson code "$VERSION_CODE" \
            '.package.downloadUrl | strings' \
            release-assets/relaytube-update.json >/dev/null
          jq -e \
            --arg version "$VERSION_NAME" \
            --argjson code "$VERSION_CODE" \
            '.package.downloadUrlList | arrays | length > 0' \
            release-assets/relaytube-update.json >/dev/null
          jq -e \
            --arg version "$VERSION_NAME" \
            --argjson code "$VERSION_CODE" \
            '.[ $version ].versionCode == $code and (.[ $version ].changelog | type == "array")' \
            release-assets/relaytube-update.json >/dev/null
          jq empty release-assets/relaytube-update.json

      - name: Publish rolling beta release
        if: inputs.channel == 'beta'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view relaytube-beta >/dev/null 2>&1; then
            gh release upload relaytube-beta release-assets/* --clobber
            gh release edit relaytube-beta \
              --target "$GITHUB_SHA" \
              --title "RelayTube ${{ inputs.version_name }}" \
              --notes "${{ inputs.release_notes }}" \
              --prerelease \
              --latest=false
          else
            gh release create relaytube-beta release-assets/* \
              --target "$GITHUB_SHA" \
              --title "RelayTube ${{ inputs.version_name }}" \
              --notes "${{ inputs.release_notes }}" \
              --prerelease \
              --latest=false
          fi

      - name: Publish stable release
        if: inputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG_NAME" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "RelayTube ${{ inputs.version_name }}" \
            --notes "${{ inputs.release_notes }}" \
            --latest
